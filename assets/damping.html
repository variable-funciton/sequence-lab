<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { margin: 0; font-family: "Source Sans Pro", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; color: #262730; background: #fff; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 8px; }
button { font: inherit; padding: 5px 14px; border: 1px solid #d0d3da; border-radius: 8px; background: #fff; cursor: pointer; }
button.main { background: #ff4b4b; color: #fff; border-color: #ff4b4b; }
.speed { display: inline-flex; border: 1px solid #d0d3da; border-radius: 8px; overflow: hidden; }
.speed button { border: 0; border-radius: 0; padding: 5px 10px; }
.speed button.on { background: #1f77b4; color: #fff; }
canvas { width: 100%; display: block; border: 1px solid #eee; border-radius: 8px; }
#scene { height: 170px; margin-bottom: 8px; }
#graph { height: 260px; }
.info { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 8px; font-size: 14px; }
.info b { color: #d62728; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="bar">
  <button class="main" id="play"></button>
  <button id="reset">↺ はじめから</button>
  <span>速さ</span>
  <div class="speed" id="speed"><button data-v="0.25">1/4</button><button data-v="0.5">1/2</button><button data-v="1">ふつう</button></div>
</div>
<canvas id="scene"></canvas>
<canvas id="graph"></canvas>
<div class="info">
  <span>時刻 <b id="i-t"></b></span>
  <span>おもりの位置 <b id="i-x"></b></span>
  <span>いまの周期の山 <b id="i-a"></b></span>
  <span id="i-r"></span>
</div>
<script>
/*__COMMON__*/
</script>
<script>
(function () {
  "use strict";
  var P = /*__PARAMS__*/;   // {mode: "viscous"|"friction", A0, r, d, N}
  var T = 1.0, A0 = P.A0, N = P.N, visc = P.mode === "viscous";
  var segs = [], tEnd = N * T, tStop = null;
  if (!visc) {   // クーロン摩擦：半周期ごとの区間 [t, t + T/2]、中心 c、出発点 s
    var D = P.d / 4, s = A0, t0 = 0;
    while (t0 < N * T - 1e-9) {
      if (Math.abs(s) <= D + 1e-12) { tStop = t0; break; }
      var c = s > 0 ? D : -D;
      segs.push({ t: t0, c: c, s: s }); s = 2 * c - s; t0 += T / 2;
    }
    segs.push({ t: t0, c: s, s: s, rest: true });
  }

  function x(t) {
    if (visc) return A0 * Math.pow(P.r, t / T) * Math.cos(2 * Math.PI * t / T);
    for (var i = segs.length - 1; i >= 0; i--) {
      var g = segs[i];
      if (t >= g.t) return g.rest ? g.s : g.c + (g.s - g.c) * Math.cos(2 * Math.PI * (t - g.t) / T);
    }
    return A0;
  }
  function peak(n) { return visc ? A0 * Math.pow(P.r, n) : Math.max(0, A0 - P.d * n); }
  var t = 0;

  function spring(ctx, x0, x1, y, coils, amp) {
    ctx.beginPath(); ctx.moveTo(x0, y);
    var lead = 10, len = x1 - x0 - 2 * lead;
    ctx.lineTo(x0 + lead, y);
    for (var i = 0; i < coils * 2; i++) ctx.lineTo(x0 + lead + len * (i + 0.5) / (coils * 2), y + (i % 2 ? amp : -amp));
    ctx.lineTo(x1 - lead, y); ctx.lineTo(x1, y); ctx.stroke();
  }

  var drawScene = AN.canvas("scene", function (ctx, w, h) {
    var floor = h - 34, wall = 30, eq = w * 0.55, scale = (w * 0.38) / (A0 * 1.15), bw = 54, bh = 46;
    var X = eq + x(t) * scale;
    // 壁と床
    ctx.fillStyle = "#9e9e9e"; ctx.fillRect(wall - 14, 20, 14, floor - 20);
    ctx.fillStyle = visc ? "#bdbdbd" : "#8d6e63"; ctx.fillRect(wall - 14, floor, w - wall, 6);
    if (!visc) { ctx.strokeStyle = "#5d4037"; for (var k = wall; k < w; k += 10) { ctx.beginPath(); ctx.moveTo(k, floor + 6); ctx.lineTo(k - 6, floor + 13); ctx.stroke(); } }
    // つり合いの位置
    ctx.save(); ctx.setLineDash([4, 4]); ctx.strokeStyle = "#2ca02c"; ctx.beginPath(); ctx.moveTo(eq, 12); ctx.lineTo(eq, floor); ctx.stroke(); ctx.restore();
    AN.text(ctx, "つり合いの位置", eq + 4, 14, "#2ca02c", "left", "11px sans-serif");
    // ばね（と、粘性減衰ならダンパー）
    var ys = visc ? floor - bh * 0.72 : floor - bh / 2;
    ctx.strokeStyle = "#555"; ctx.lineWidth = 2; spring(ctx, wall, X - bw / 2, ys, 9, 9); ctx.lineWidth = 1;
    if (visc) {   // ダンパー（油の入った筒とピストン）
      var yd = floor - bh * 0.25, cx0 = wall + (X - bw / 2 - wall) * 0.35, cx1 = cx0 + 60;
      ctx.strokeStyle = "#555"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(wall, yd); ctx.lineTo(cx0, yd); ctx.stroke();
      ctx.fillStyle = "rgba(255,193,7,0.35)"; ctx.fillRect(cx0, yd - 9, 60, 18); ctx.strokeRect(cx0, yd - 9, 60, 18);
      var px = Math.min(cx1 - 6, Math.max(cx0 + 6, cx0 + 30 + (X - eq) * 0.5));
      ctx.beginPath(); ctx.moveTo(px, yd - 7); ctx.lineTo(px, yd + 7); ctx.moveTo(px, yd); ctx.lineTo(X - bw / 2, yd); ctx.stroke();
      ctx.lineWidth = 1;
      AN.text(ctx, "ダンパー（油の抵抗）", cx0, yd + 22, "#795548", "left", "11px sans-serif");
    }
    // おもり
    ctx.fillStyle = "#1f77b4"; ctx.fillRect(X - bw / 2, floor - bh, bw, bh);
    AN.text(ctx, "m", X, floor - bh / 2 + 5, "#fff", "center", "bold 15px sans-serif");
    // 振幅の目盛
    ctx.save(); ctx.setLineDash([2, 3]); ctx.strokeStyle = "#d62728";
    [A0, -A0].forEach(function (a) { ctx.beginPath(); ctx.moveTo(eq + a * scale, floor - bh - 8); ctx.lineTo(eq + a * scale, floor); ctx.stroke(); });
    ctx.restore();
    AN.text(ctx, visc ? "空気・油の抵抗（速さに比例）" : "床との摩擦（大きさ一定）", w - 8, floor + 26, "#333", "right", "12px sans-serif");
  });

  var drawGraph = AN.canvas("graph", function (ctx, w, h) {
    var box = { x: 44, y: 22, w: w - 60, h: h - 58 }, Y = A0 * 1.15;
    var M = AN.axes(ctx, box, [0, N * T], [-Y, Y], { xticks: AN.ticks(0, N * T, 10), yticks: AN.ticks(-A0, A0, 4), xlabel: "時間（周期）", ylabel: "位置 x [mm]" });
    // 包絡線
    var ex = [], ey = [], ey2 = [];
    for (var i = 0; i <= 200; i++) { var tt = N * T * i / 200; ex.push(tt); ey.push(visc ? A0 * Math.pow(P.r, tt / T) : Math.max(0, A0 - P.d * tt / T)); ey2.push(-ey[i]); }
    AN.polyline(ctx, M, ex, ey, "rgba(214,39,40,0.5)", 1.2, [4, 4]); AN.polyline(ctx, M, ex, ey2, "rgba(214,39,40,0.5)", 1.2, [4, 4]);
    // ここまでの位置
    var xs = [], vs = [], n = Math.max(2, Math.ceil(t / (N * T) * 1200));
    for (var j = 0; j <= n; j++) { var tj = t * j / n; xs.push(tj); vs.push(x(tj)); }
    AN.polyline(ctx, M, xs, vs, "#1f77b4", 2);
    // 山 A_n
    for (var k = 0; k <= N && k * T <= t + 1e-9; k++) {
      var a = peak(k); if (!visc && k * T > (tStop === null ? Infinity : tStop)) break;
      AN.dot(ctx, M.X(k * T), M.Y(x(k * T)), 4, "#d62728");
      if (k <= 12) AN.text(ctx, "A" + k, M.X(k * T), M.Y(x(k * T)) - 8, "#d62728", "center", "11px sans-serif");
    }
    AN.dot(ctx, M.X(t), M.Y(x(t)), 5.5, "#1f77b4");
  });

  function info() {
    var $ = function (id) { return document.getElementById(id); }, n = Math.floor(t / T + 1e-9);
    $("i-t").textContent = t.toFixed(2) + " 周期";
    $("i-x").textContent = x(t).toFixed(2) + " mm";
    if (!visc && tStop !== null && t > tStop) {
      $("i-a").textContent = "止まった（ばねの力が摩擦に勝てない）"; $("i-r").innerHTML = ""; return;
    }
    var a = peak(Math.min(n, N));
    $("i-a").textContent = "A" + n + " = " + a.toFixed(3) + " mm";
    $("i-r").innerHTML = n >= 1 ? (visc ? "前の山との比 <b>" + (peak(n) / peak(n - 1)).toFixed(3) + "</b>（等比数列）"
                                         : "前の山との差 <b>" + (peak(n) - peak(n - 1)).toFixed(3) + " mm</b>（等差数列）") : "";
  }
  function draw() { drawScene(); drawGraph(); info(); }

  var sp = AN.speed(document.getElementById("speed"), 0.5);
  new AN.Player(document.getElementById("play"), function (dt) {
    if (t >= N * T) t = 0;
    t += dt * sp();
    if (t >= N * T) { t = N * T; draw(); return false; }
    draw();
  });
  document.getElementById("reset").addEventListener("click", function () { t = 0; draw(); });
  draw();
  window.__test = { x: x, set: function (v) { t = v; draw(); }, peak: peak };
})();
</script>
</body>
</html>
