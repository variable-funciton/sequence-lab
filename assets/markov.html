<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { margin: 0; font-family: "Source Sans Pro", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; color: #262730; background: #fff; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 8px; }
button { font: inherit; padding: 5px 14px; border: 1px solid #d0d3da; border-radius: 8px; background: #fff; cursor: pointer; }
button.main { background: #ff4b4b; color: #fff; border-color: #ff4b4b; }
.speed { display: inline-flex; border: 1px solid #d0d3da; border-radius: 8px; overflow: hidden; }
.speed button { border: 0; border-radius: 0; padding: 5px 10px; }
.speed button.on { background: #1f77b4; color: #fff; }
#words { min-height: 96px; max-height: 96px; overflow: hidden; border: 1px solid #eee; border-radius: 8px; padding: 6px 8px; font-size: 20px; line-height: 1.5; letter-spacing: 1px; word-break: break-all; display: flex; flex-wrap: wrap; align-content: flex-end; }
#words span.new { outline: 2px solid #d62728; border-radius: 4px; }
canvas { width: 100%; height: 250px; display: block; border: 1px solid #eee; border-radius: 8px; margin-top: 8px; }
.info { margin-top: 8px; font-size: 15px; background: #f6f8fb; border-left: 4px solid #1f77b4; padding: 6px 10px; font-variant-numeric: tabular-nums; }
.info b { color: #d62728; }
</style>
</head>
<body>
<div class="bar">
  <button class="main" id="play"></button>
  <button id="one">1 つ出力 ▶|</button>
  <button id="many">一気に 1000 個</button>
  <button id="reset">↺ はじめから</button>
  <span>速さ</span>
  <div class="speed" id="speed"><button data-v="2">ゆっくり</button><button data-v="8">ふつう</button><button data-v="40">速い</button></div>
</div>
<div id="words"></div>
<canvas id="graph"></canvas>
<div class="info" id="info"></div>
<script>
/*__COMMON__*/
</script>
<script>
(function () {
  "use strict";
  var P = /*__PARAMS__*/;   // {a, b, p1, limit}
  var seq = [], sun = 0, freq = [];
  function next() {
    var x;
    if (!seq.length) x = Math.random() < P.p1 ? 1 : 0;
    else x = Math.random() < (seq[seq.length - 1] === 1 ? P.a : P.b) ? 1 : 0;
    seq.push(x); sun += x; freq.push(sun / seq.length);
  }
  function words() {
    var el = document.getElementById("words"), show = seq.slice(-60), start = seq.length - show.length;
    el.innerHTML = show.map(function (x, i) { return "<span" + (start + i === seq.length - 1 ? " class='new'" : "") + ">" + (x ? "☀️" : "☔") + "</span>"; }).join("");
  }
  var draw = AN.canvas("graph", function (ctx, w, h) {
    var n = Math.max(20, seq.length);
    var box = { x: 46, y: 20, w: w - 60, h: h - 56 };
    var M = AN.axes(ctx, box, [1, n], [0, 1], { xticks: AN.ticks(0, n, 8).filter(function (t) { return t >= 1; }), yticks: [0, 0.25, 0.5, 0.75, 1], xlabel: "出力した数 n", ylabel: "晴れの割合" });
    if (P.limit !== null) {
      ctx.save(); ctx.setLineDash([5, 4]); ctx.strokeStyle = "#2ca02c"; ctx.beginPath(); ctx.moveTo(box.x, M.Y(P.limit)); ctx.lineTo(box.x + box.w, M.Y(P.limit)); ctx.stroke(); ctx.restore();
      AN.text(ctx, "極限 " + P.limit.toFixed(4), box.x + box.w - 4, M.Y(P.limit) - 5, "#2ca02c", "right", "12px sans-serif");
    }
    var xs = [], ys = [], step = Math.max(1, Math.floor(freq.length / 800));
    for (var i = 0; i < freq.length; i += step) { xs.push(i + 1); ys.push(freq[i]); }
    if (freq.length) { xs.push(freq.length); ys.push(freq[freq.length - 1]); }
    AN.polyline(ctx, M, xs, ys, "#d62728", 2);
  });
  function info() {
    var n = seq.length, runs = [], r = 0;
    for (var i = 0; i < n; i++) { if (seq[i] === 1) r++; else if (r) { runs.push(r); r = 0; } }
    if (r) runs.push(r);
    var maxRun = runs.length ? Math.max.apply(null, runs) : 0;
    document.getElementById("info").innerHTML = "出力した数 <b>" + n + "</b>　晴れ <b>" + sun + "</b> 回、雨 " + (n - sun) + " 回　晴れの割合 <b>" + (n ? (sun / n).toFixed(4) : "—")
      + "</b>（式で求めた極限 " + (P.limit === null ? "—" : P.limit.toFixed(4)) + "）　晴れが続いた最長 " + maxRun + " 回";
  }
  function redraw() { words(); draw(); info(); }
  var acc = 0, sp = AN.speed(document.getElementById("speed"), 8);
  var player = new AN.Player(document.getElementById("play"), function (dt) { acc += dt * sp(); while (acc >= 1) { next(); acc -= 1; } redraw(); });
  document.getElementById("one").addEventListener("click", function () { next(); redraw(); });
  document.getElementById("many").addEventListener("click", function () { for (var i = 0; i < 1000; i++) next(); redraw(); });
  document.getElementById("reset").addEventListener("click", function () { player.stop(); seq = []; sun = 0; freq = []; redraw(); });
  redraw();
  window.__test = { run: function (k) { for (var i = 0; i < k; i++) next(); redraw(); return sun / seq.length; } };
})();
</script>
</body>
</html>
