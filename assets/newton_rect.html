<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { margin: 0; font-family: "Source Sans Pro", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; color: #262730; background: #fff; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 8px; }
button { font: inherit; padding: 5px 14px; border: 1px solid #d0d3da; border-radius: 8px; background: #fff; cursor: pointer; }
button.main { background: #ff4b4b; color: #fff; border-color: #ff4b4b; }
canvas { width: 100%; height: 330px; display: block; border: 1px solid #eee; border-radius: 8px; }
.info { margin-top: 8px; font-size: 15px; background: #f6f8fb; border-left: 4px solid #1f77b4; padding: 6px 10px; font-variant-numeric: tabular-nums; }
.info b { color: #d62728; }
</style>
</head>
<body>
<div class="bar">
  <button class="main" id="play"></button>
  <button id="next">次の 1 回 ▶|</button>
  <button id="reset">↺ はじめから</button>
</div>
<canvas id="scene"></canvas>
<div class="info" id="info"></div>
<script>
/*__COMMON__*/
</script>
<script>
(function () {
  "use strict";
  var P = /*__PARAMS__*/;   // {a, xs: [x_0, x_1, …]}
  var a = P.a, xs = P.xs, r = Math.sqrt(a);
  var s = 0;                // 「何回目の途中か」：整数 n で x_n の長方形、n と n+1 の間はなめらかに変形
  var last = xs.length - 1;

  function sideAt(s) {
    var n = Math.min(last, Math.floor(s)), f = Math.min(1, s - n);
    if (n >= last) return xs[last];
    var e = f * f * (3 - 2 * f);   // なめらかに
    return xs[n] + (xs[n + 1] - xs[n]) * e;
  }

  var draw = AN.canvas("scene", function (ctx, w, h) {
    var maxSide = 0;
    xs.forEach(function (x) { maxSide = Math.max(maxSide, x, a / x); });
    var pad = 40, sc = Math.min((w - 2 * pad) / maxSide, (h - 2 * pad) / maxSide) * 0.95;
    var ox = pad + 10, oy = h - pad;
    var W = sideAt(s), H = a / W;
    // 正方形（目標）
    ctx.save(); ctx.setLineDash([6, 4]); ctx.strokeStyle = "#2ca02c"; ctx.lineWidth = 1.5;
    ctx.strokeRect(ox, oy - r * sc, r * sc, r * sc); ctx.restore();
    AN.text(ctx, "目標の正方形（1 辺 √" + a + " = " + r.toFixed(6) + "）", ox + r * sc + 6, oy - r * sc + 12, "#2ca02c", "left", "12px sans-serif");
    // 長方形
    ctx.fillStyle = "rgba(31,119,180,0.18)"; ctx.fillRect(ox, oy - H * sc, W * sc, H * sc);
    ctx.strokeStyle = "#1f77b4"; ctx.lineWidth = 2.5; ctx.strokeRect(ox, oy - H * sc, W * sc, H * sc); ctx.lineWidth = 1;
    AN.text(ctx, "横 x = " + W.toFixed(6), ox + W * sc / 2, oy + 18, "#1f77b4", "center", "bold 13px sans-serif");
    ctx.save(); ctx.translate(ox - 8, oy - H * sc / 2); ctx.rotate(-Math.PI / 2);
    AN.text(ctx, "縦 " + a + "/x = " + H.toFixed(6), 0, 0, "#d62728", "center", "bold 13px sans-serif"); ctx.restore();
    AN.text(ctx, "面積 = " + a + "（いつも同じ）", ox + W * sc / 2, oy - H * sc / 2 + 5, "#333", "center", "13px sans-serif");
  });

  function info() {
    var n = Math.min(last, Math.floor(s + 1e-9)), x = xs[n];
    var html = "x<sub>" + n + "</sub> = <b>" + x.toPrecision(12) + "</b>、" + a + "/x<sub>" + n + "</sub> = " + (a / x).toPrecision(12);
    if (n < last) html += "　→　平均をとると x<sub>" + (n + 1) + "</sub> = (" + x.toPrecision(6) + " + " + (a / x).toPrecision(6) + ") ÷ 2 = <b>" + xs[n + 1].toPrecision(12) + "</b>";
    else html += "　（縦と横がほとんど同じ：正方形になった）";
    document.getElementById("info").innerHTML = html;
  }
  function redraw() { draw(); info(); }

  var player = new AN.Player(document.getElementById("play"), function (dt) {
    if (s >= last) s = 0;
    s += dt * 0.7;
    if (s >= last) { s = last; redraw(); return false; }
    redraw();
  });
  document.getElementById("next").addEventListener("click", function () {
    player.stop();
    var target = Math.min(last, Math.floor(s + 1e-9) + 1), from = s, t0 = null;
    function anim(ts) { if (t0 === null) t0 = ts; var f = Math.min(1, (ts - t0) / 700); s = from + (target - from) * f; redraw(); if (f < 1) requestAnimationFrame(anim); }
    requestAnimationFrame(anim);
  });
  document.getElementById("reset").addEventListener("click", function () { player.stop(); s = 0; redraw(); });
  redraw();
  window.__test = { set: function (v) { s = v; redraw(); } };
})();
</script>
</body>
</html>
